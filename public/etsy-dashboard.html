<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Etsy - Generatore Dediche</title>
<style>
  body {
    background-color: #121212;
    color: #e0e0e0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
  }
  .container {
    background-color: #1e1e1e;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 8px 16px rgba(0,0,0,0.5);
    max-width: 600px;
    width: 100%;
  }
  h1, h2 {
    text-align: center;
    color: #ffffff;
  }
  .section {
    margin-bottom: 25px;
    padding-bottom: 15px;
    border-bottom: 1px solid #333;
  }
  label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
    color: #bbb;
  }
  input[type="text"], input[type="password"], textarea, input[type="file"] {
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
    border: 1px solid #444;
    border-radius: 6px;
    background-color: #2a2a2a;
    color: #fff;
    box-sizing: border-box;
  }
  input[type="text"]:focus, input[type="password"]:focus, textarea:focus {
    outline: none;
    border-color: #00adb5;
  }
  button {
    width: 100%;
    padding: 12px;
    background-color: #00adb5;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.3s;
  }
  button:hover {
    background-color: #007a80;
  }
  .output-area {
    margin-top: 20px;
    display: none;
    background-color: #2a2a2a;
    padding: 15px;
    border-radius: 6px;
    border: 1px solid #444;
  }
  .output-area a {
    color: #00adb5;
    word-break: break-all;
  }
  .loader {
    display: none;
    text-align: center;
    margin-top: 15px;
  }
</style>
</head>
<body>

<div class="container">
  <h1>Dashboard Etsy</h1>
  
  <div class="section">
    <h2>1. Configurazione GitHub</h2>
    <label for="ghUser">Username GitHub</label>
    <input type="text" id="ghUser" placeholder="es. mario-rossi">
    
    <label for="ghRepo">Nome Repository</label>
    <input type="text" id="ghRepo" placeholder="es. mie-dediche">
    
    <label for="ghToken">Personal Access Token (PAT)</label>
    <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxx">
  </div>

  <div class="section">
    <h2>2. Crea Dedica</h2>
    <label for="dedicaId">ID/Cartella (URL)</label>
    <input type="text" id="dedicaId" placeholder="es. mario-elena">
    
    <label for="dedicaTitle">Titolo Principale</label>
    <input type="text" id="dedicaTitle" placeholder="es. Buon Compleanno Elena!">
    
    <label for="dedicaMessage">Testo del Messaggio</label>
    <textarea id="dedicaMessage" rows="4" placeholder="Scrivi qui la tua dedica..."></textarea>
    
    <label for="dedicaImages">Immagini (max 3)</label>
    <input type="file" id="dedicaImages" accept="image/*" multiple>
    <small style="color:#888; display:block; margin-top:-10px; margin-bottom:15px;">Le immagini saranno convertite in Base64 (max 3).</small>
  </div>

  <button id="btnPublish">Genera e Pubblica</button>
  
  <div class="loader" id="loader">Pubblicazione in corso su GitHub... Attendere.</div>

  <div class="output-area" id="outputArea">
    <h3>Pubblicazione Completata! 🎉</h3>
    <p>Ecco il link alla dedica:</p>
    <p><a href="#" id="finalLink" target="_blank"></a></p>
    <button id="btnCopy" style="background-color: #333; margin-top: 10px;">Copia Link</button>
  </div>
</div>

<script>
  // Load configuration from LocalStorage
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('ghUser').value = localStorage.getItem('etsy_ghUser') || '';
    document.getElementById('ghRepo').value = localStorage.getItem('etsy_ghRepo') || '';
    document.getElementById('ghToken').value = localStorage.getItem('etsy_ghToken') || '';
  });

  // Convert file to Base64
  const fileToBase64 = file => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = () => resolve(reader.result);
    reader.onerror = error => reject(error);
  });

  // Template for the final HTML page
  const generateTemplate = (title, message, imagesBase64) => {
    let imagesHtml = '';
    imagesBase64.forEach(img => {
      imagesHtml += `<img src="${img}" alt="Immagine dedica" style="max-width: 100%; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(255,255,255,0.1);">\n`;
    });

    return `<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${title}</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background-color: #000;
    color: #fff;
    font-family: 'Helvetica Neue', sans-serif;
  }
  canvas {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
    z-index: 1;
  }
  .content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    box-sizing: border-box;
    background: rgba(0, 0, 0, 0.4);
    text-align: center;
  }
  .card {
    background: rgba(20, 20, 20, 0.8);
    backdrop-filter: blur(10px);
    padding: 40px;
    border-radius: 20px;
    max-width: 600px;
    box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255,255,255,0.1);
  }
  h1 { margin-top: 0; font-size: 2.5em; text-shadow: 0 2px 10px rgba(255,255,255,0.3); }
  p { font-size: 1.2em; line-height: 1.6; }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="content">
  <div class="card">
    <h1>${title}</h1>
    <p>${message.replace(/\n/g, '<br>')}</p>
    ${imagesHtml}
  </div>
</div>
<script>
  // Costellazione d'Amore Canvas Animation
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  let width, height;
  let particles = [];
  
  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const mouse = { x: null, y: null };
  window.addEventListener('mousemove', e => { mouse.x = e.x; mouse.y = e.y; });
  window.addEventListener('touchmove', e => { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; });
  window.addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; });
  window.addEventListener('touchend', () => { mouse.x = null; mouse.y = null; });

  class Particle {
    constructor() {
      this.x = Math.random() * width;
      this.y = Math.random() * height;
      this.vx = (Math.random() - 0.5) * 1;
      this.vy = (Math.random() - 0.5) * 1;
      this.radius = Math.random() * 2 + 1;
    }
    update() {
      this.x += this.vx;
      this.y += this.vy;
      if (this.x < 0 || this.x > width) this.vx *= -1;
      if (this.y < 0 || this.y > height) this.vy *= -1;
    }
    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
      ctx.fill();
    }
  }

  for (let i = 0; i < 100; i++) particles.push(new Particle());

  function animate() {
    ctx.clearRect(0, 0, width, height);
    
    for (let i = 0; i < particles.length; i++) {
      particles[i].update();
      particles[i].draw();
      
      // Connect to mouse
      if (mouse.x != null) {
        let dx = mouse.x - particles[i].x;
        let dy = mouse.y - particles[i].y;
        let dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 150) {
          ctx.beginPath();
          ctx.strokeStyle = \`rgba(255, 255, 255, \${1 - dist/150})\`;
          ctx.lineWidth = 1;
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(mouse.x, mouse.y);
          ctx.stroke();
        }
      }

      // Connect particles
      for (let j = i + 1; j < particles.length; j++) {
        let dx = particles[i].x - particles[j].x;
        let dy = particles[i].y - particles[j].y;
        let dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 100) {
          ctx.beginPath();
          ctx.strokeStyle = \`rgba(255, 255, 255, \${0.2 * (1 - dist/100)})\`;
          ctx.lineWidth = 1;
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(animate);
  }
  animate();
<\/script>
</body>
</html>`;
  };

  // Convert string to Base64 (Unicode safe)
  function utf8_to_b64(str) {
    return window.btoa(unescape(encodeURIComponent(str)));
  }

  // Handle Publish
  document.getElementById('btnPublish').addEventListener('click', async () => {
    const ghUser = document.getElementById('ghUser').value.trim();
    const ghRepo = document.getElementById('ghRepo').value.trim();
    const ghToken = document.getElementById('ghToken').value.trim();
    
    const dedicaId = document.getElementById('dedicaId').value.trim();
    const dedicaTitle = document.getElementById('dedicaTitle').value.trim();
    const dedicaMessage = document.getElementById('dedicaMessage').value.trim();
    const fileInput = document.getElementById('dedicaImages');

    if (!ghUser || !ghRepo || !ghToken || !dedicaId || !dedicaTitle || !dedicaMessage) {
      alert("Compila tutti i campi obbligatori.");
      return;
    }

    // Save config
    localStorage.setItem('etsy_ghUser', ghUser);
    localStorage.setItem('etsy_ghRepo', ghRepo);
    localStorage.setItem('etsy_ghToken', ghToken);

    document.getElementById('btnPublish').style.display = 'none';
    document.getElementById('loader').style.display = 'block';
    document.getElementById('outputArea').style.display = 'none';

    try {
      // Process images (max 3)
      const imagesBase64 = [];
      const files = Array.from(fileInput.files).slice(0, 3);
      for (let file of files) {
        const b64 = await fileToBase64(file);
        imagesBase64.push(b64);
      }

      // Generate HTML content
      const htmlContent = generateTemplate(dedicaTitle, dedicaMessage, imagesBase64);
      const b64Content = utf8_to_b64(htmlContent);

      // Check if file exists to get SHA (for updates)
      const apiUrl = `https://api.github.com/repos/${ghUser}/${ghRepo}/contents/${dedicaId}/index.html`;
      let sha = null;
      
      try {
        const checkRes = await fetch(apiUrl, {
          headers: { 'Authorization': `token ${ghToken}` }
        });
        if (checkRes.ok) {
          const checkData = await checkRes.json();
          sha = checkData.sha;
        }
      } catch (e) {
        console.log("File non esiste ancora, verrà creato nuovo.");
      }

      // Prepare payload
      const payload = {
        message: `Aggiunta dedica: ${dedicaTitle}`,
        content: b64Content
      };
      if (sha) payload.sha = sha;

      // Make PUT request
      const putRes = await fetch(apiUrl, {
        method: 'PUT',
        headers: {
          'Authorization': `token ${ghToken}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      });

      if (!putRes.ok) {
        const errData = await putRes.json();
        throw new Error(errData.message || "Errore sconosciuto da GitHub");
      }

      // Success
      const pagesLink = `https://${ghUser}.github.io/${ghRepo}/${dedicaId}/`;
      document.getElementById('finalLink').href = pagesLink;
      document.getElementById('finalLink').textContent = pagesLink;
      document.getElementById('outputArea').style.display = 'block';

    } catch (error) {
      alert("Errore durante la pubblicazione: " + error.message);
    } finally {
      document.getElementById('btnPublish').style.display = 'block';
      document.getElementById('loader').style.display = 'none';
    }
  });

  // Copy Link
  document.getElementById('btnCopy').addEventListener('click', () => {
    const link = document.getElementById('finalLink').href;
    navigator.clipboard.writeText(link).then(() => {
      alert("Link copiato negli appunti!");
    });
  });
</script>

</body>
</html>
